
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<title>دامداری شیری بلوط | Baloot Farm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#09251d}
a{text-decoration:none;color:inherit}
header{background:#09251d;border-bottom:1px solid #d6b46a;padding:15px 5%}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}

nav{grid-column:2;display:flex;gap:28px;justify-content:center}
nav a{color:#f5f1e7;font-size:15px}

.nav-spacer{justify-self:end}
.hero-image img{display:block;width:100%;height:auto;max-height:calc(100vh - 75px);object-fit:cover}
@media(max-width:650px){

.logo{font-size:25px}
nav{grid-column:1;gap:20px;flex-wrap:wrap}
